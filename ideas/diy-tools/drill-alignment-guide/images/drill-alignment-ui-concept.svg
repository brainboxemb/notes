<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 245" role="img" aria-labelledby="title description">
  <title id="title">Round display UI concept for drill alignment</title>
  <desc id="description">Three circular screens show a drill moving from off-angle, through nearly aligned, to fully aligned. A colored dot moves toward the center of a crosshair.</desc>
  <style>
    .screen{fill:#111820;stroke:#3e474f;stroke-width:9}
    .inner{fill:none;stroke:#7a858d;stroke-width:3}
    .axis{stroke:#77828a;stroke-width:2.5;stroke-linecap:round}
    .angle{font:600 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f4f7f9;text-anchor:middle}
    .label{font:600 19px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#25374b;text-anchor:middle}
    .arrow{font:400 38px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#83929e;text-anchor:middle}
  </style>
  <rect x="0" y="0" width="720" height="245" fill="#fff"/>
  <!-- Screen 1: off-angle -->
  <g transform="translate(120 101)">
    <circle class="screen" r="80"/>
    <circle r="74" fill="none" stroke="#e84f47" stroke-width="4" stroke-dasharray="48 112" transform="rotate(-27)"/>
    <text class="angle" y="-53">6.5°</text>
    <circle class="inner" r="45" cy="8"/>
    <path class="axis" d="M -45,8 H 45 M 0,-37 V 53"/>
    <circle cx="27" cy="27" r="10" fill="#ef4c43"/>
  </g>
  <text class="label" x="120" y="216">Off angle</text>
  <text class="arrow" x="240" y="114">›</text>
  <!-- Screen 2: approaching alignment -->
  <g transform="translate(360 101)">
    <circle class="screen" r="80"/>
    <circle r="74" fill="none" stroke="#e5bf2e" stroke-width="4" stroke-dasharray="48 112" transform="rotate(-27)"/>
    <text class="angle" y="-53">1.2°</text>
    <circle class="inner" r="45" cy="8"/>
    <path class="axis" d="M -45,8 H 45 M 0,-37 V 53"/>
    <circle cx="9" cy="13" r="11" fill="#e9cf36"/>
  </g>
  <text class="label" x="360" y="216">Nearly aligned</text>
  <text class="arrow" x="480" y="114">›</text>
  <!-- Screen 3: aligned -->
  <g transform="translate(600 101)">
    <circle class="screen" r="80"/>
    <circle r="74" fill="none" stroke="#46d765" stroke-width="4"/>
    <text class="angle" y="-53">0.0°</text>
    <circle cx="0" cy="8" r="45" fill="none" stroke="#46d765" stroke-width="3"/>
    <path d="M -45,8 H 45 M 0,-37 V 53" fill="none" stroke="#46d765" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="8" r="13" fill="#46d765"/>
  </g>
  <text class="label" x="600" y="216">Aligned</text>
</svg>
