<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Five-panel P5 HUB75 display concept</title>
  <desc id="desc">Five portrait-oriented P5 HUB75 panels arranged side by side, forming a display approximately 800 by 320 millimetres with a resolution of 160 by 64 pixels.</desc>

  <defs>
    <pattern id="led-grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.25" fill="#31495b"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#0b3154"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#f7f9fa"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#0b3154">
    <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700">5 × P5 HUB75 panels</text>
    <text x="600" y="82" text-anchor="middle" font-size="20">project goal — front view</text>
  </g>

  <g>
    <rect x="170" y="150" width="800" height="320" rx="8" fill="#08131d" stroke="#0b3154" stroke-width="8"/>

    <g fill="url(#led-grid)" stroke="#456173" stroke-width="3">
      <rect x="174" y="154" width="159" height="312"/>
      <rect x="333" y="154" width="159" height="312"/>
      <rect x="492" y="154" width="159" height="312"/>
      <rect x="651" y="154" width="159" height="312"/>
      <rect x="810" y="154" width="156" height="312"/>
    </g>

    <g fill="#35b6b2" opacity=".95">
      <circle cx="250" cy="250" r="4"/><circle cx="260" cy="250" r="4"/><circle cx="270" cy="250" r="4"/>
      <circle cx="420" cy="310" r="4"/><circle cx="430" cy="310" r="4"/><circle cx="440" cy="310" r="4"/>
      <circle cx="580" cy="275" r="4"/><circle cx="590" cy="275" r="4"/><circle cx="600" cy="275" r="4"/>
    </g>
    <g fill="#12a875" opacity=".95">
      <circle cx="735" cy="335" r="4"/><circle cx="745" cy="335" r="4"/><circle cx="755" cy="335" r="4"/>
      <circle cx="885" cy="290" r="4"/><circle cx="895" cy="290" r="4"/><circle cx="905" cy="290" r="4"/>
    </g>
  </g>

  <g stroke="#0b3154" stroke-width="3" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="170" y1="120" x2="970" y2="120"/>
    <line x1="1010" y1="150" x2="1010" y2="470"/>
  </g>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#0b3154">
    <text x="570" y="108" text-anchor="middle" font-size="22" font-weight="700">≈ 800 mm</text>
    <text x="1044" y="310" text-anchor="middle" font-size="22" font-weight="700" transform="rotate(90 1044 310)">≈ 320 mm</text>
  </g>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="185" y="495" width="770" height="44" rx="8" fill="#e8f5f1"/>
    <text x="570" y="524" text-anchor="middle" font-size="23" font-weight="700" fill="#0b3154">Resolution: 160 × 64 pixels</text>
  </g>
</svg>