<svg xmlns="http://www.w3.org/2000/svg" width="300" height="190" viewBox="0 0 300 190" role="img" aria-labelledby="title desc">
  <title id="title">Eckstein ER-OA001 XT30 6-port power distribution board</title>
  <desc id="desc">Schematic thumbnail showing a black PLA enclosure with one XT30 input and six parallel XT30 outputs.</desc>
  <rect width="300" height="190" fill="#fff"/>
  <g transform="translate(40 32)">
    <rect x="18" y="18" width="184" height="102" rx="18" fill="#202327" stroke="#0d0f11" stroke-width="3"/>
    <g fill="#353a40">
      <rect x="32" y="33" width="154" height="8" rx="4"/>
      <rect x="32" y="97" width="154" height="8" rx="4"/>
    </g>
    <!-- six XT30 output sockets -->
    <g fill="#f3ad19" stroke="#b77900" stroke-width="2">
      <g transform="translate(43 49)"><rect width="30" height="34" rx="5"/><circle cx="9" cy="17" r="5" fill="#fff3c4"/><circle cx="21" cy="17" r="5" fill="#fff3c4"/></g>
      <g transform="translate(78 49)"><rect width="30" height="34" rx="5"/><circle cx="9" cy="17" r="5" fill="#fff3c4"/><circle cx="21" cy="17" r="5" fill="#fff3c4"/></g>
      <g transform="translate(113 49)"><rect width="30" height="34" rx="5"/><circle cx="9" cy="17" r="5" fill="#fff3c4"/><circle cx="21" cy="17" r="5" fill="#fff3c4"/></g>
      <g transform="translate(148 49)"><rect width="30" height="34" rx="5"/><circle cx="9" cy="17" r="5" fill="#fff3c4"/><circle cx="21" cy="17" r="5" fill="#fff3c4"/></g>
      <g transform="translate(60 85)"><rect width="30" height="34" rx="5"/><circle cx="9" cy="17" r="5" fill="#fff3c4"/><circle cx="21" cy="17" r="5" fill="#fff3c4"/></g>
      <g transform="translate(125 85)"><rect width="30" height="34" rx="5"/><circle cx="9" cy="17" r="5" fill="#fff3c4"/><circle cx="21" cy="17" r="5" fill="#fff3c4"/></g>
    </g>
    <!-- input -->
    <g transform="translate(0 53)" fill="#f3ad19" stroke="#b77900" stroke-width="2">
      <rect width="38" height="34" rx="5"/>
      <circle cx="12" cy="17" r="5" fill="#fff3c4"/>
      <circle cx="26" cy="17" r="5" fill="#fff3c4"/>
    </g>
    <!-- mounting holes -->
    <g fill="#b7bec5" stroke="#707980" stroke-width="2">
      <circle cx="32" cy="30" r="7"/><circle cx="188" cy="108" r="7"/>
    </g>
  </g>
  <text x="150" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#0b3154">Eckstein ER-OA001 · XT30 6-port</text>
  <text x="150" y="181" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#596874">schematic reference illustration</text>
</svg>