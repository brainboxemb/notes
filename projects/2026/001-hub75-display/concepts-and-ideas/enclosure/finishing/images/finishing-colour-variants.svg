<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="t d">
<title id="t">HUB75 display enclosure: light grey versus silver grey</title>
<desc id="d">Two identical three-quarter-view illustrations of the HUB75 five-panel display enclosure; the left is RAL 7035 light grey and the right is RAL 7001 silver grey. The black screen and dimensions are identical; only the housing colour changes.</desc>
