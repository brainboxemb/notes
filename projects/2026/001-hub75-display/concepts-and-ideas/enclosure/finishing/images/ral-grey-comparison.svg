<svg xmlns="http://www.w3.org/2000/svg" width="630" height="166" viewBox="0 0 630 166" role="img" aria-labelledby="title description">
<title id="title">RAL grey comparison: 7035, 7001 and 7016</title>
<desc id="description">Indicative colour swatches for RAL 7035 light grey, RAL 7001 silver grey and RAL 7016 anthracite grey. Screen colours do not replace physical RAL samples.</desc>
<rect width="630" height="166" rx="7" fill="#f7f8f9"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="12" y="12" width="194" height="142" rx="5" fill="#ffffff" stroke="#d8dee3"/>
<rect x="20" y="20" width="178" height="78" rx="3" fill="#C2C7C4"/>
<text x="20" y="118" font-weight="bold" font-size="17" fill="#283741">RAL 7035</text>
<text x="20" y="138" font-size="13" fill="#52606b">Light grey</text>
<rect x="218" y="12" width="194" height="142" rx="5" fill="#ffffff" stroke="#d8dee3"/>
<rect x="226" y="20" width="178" height="78" rx="3" fill="#88959D"/>
<text x="226" y="118" font-weight="bold" font-size="17" fill="#283741">RAL 7001</text>
<text x="226" y="138" font-size="13" fill="#52606b">Silver grey</text>
<rect x="424" y="12" width="194" height="142" rx="5" fill="#ffffff" stroke="#d8dee3"/>
<rect x="432" y="20" width="178" height="78" rx="3" fill="#363E42"/>
<text x="432" y="118" font-weight="bold" font-size="17" fill="#283741">RAL 7016</text>
<text x="432" y="138" font-size="13" fill="#52606b">Anthracite</text>
</g>
</svg>