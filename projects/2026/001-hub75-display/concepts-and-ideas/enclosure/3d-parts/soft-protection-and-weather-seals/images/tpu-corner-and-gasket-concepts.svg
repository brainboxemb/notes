<text x="759" y="151" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#7b5730">Lid</text>
<text x="754" y="269" font-family="Arial, sans-serif" font-size="17" fill="#7b5730">Enclosure wall</text>
<text x="515" y="294" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#a75c23">Continuous</text>
<text x="515" y="315" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#a75c23">EPDM / silicone</text>
<line x1="647" y1="300" x2="686" y2="234" stroke="#a75c23" stroke-width="2"/>
<circle cx="686" cy="234" r="4" fill="#a75c23"/>
<text x="519" y="361" font-family="Arial, sans-serif" font-size="15" fill="#536274">Closing the lid compresses the seal</text>
<text x="519" y="382" font-family="Arial, sans-serif" font-size="14" fill="#536274">Gasket path must continue around whole opening</text>
